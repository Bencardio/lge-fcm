# =====================================================================
#  Paramètres de l'analyse du rehaussement tardif (LGE)
#  Modifiez les valeurs après le signe "=", puis enregistrez le fichier.
#  Les lignes qui commencent par # sont des commentaires.
# =====================================================================

[fuzzy_c_means]
# Nombre de classes (c). 2 = myocarde sain / rehaussé.
# 3 = sain / intermédiaire (zone grise) / rehaussé.
nb_classes = 2
# Coefficient de flou (m), supérieur à 1. La valeur classique est 2.
coefficient_flou = 2
# Combien des classes les plus brillantes comptent comme « rehaussées ».
# Avec nb_classes = 3 : 1 = seulement la classe la plus brillante, 2 = brillante + intermédiaire.
classes_rehaussees = 1
# "patient" : une seule classification sur toutes les coupes du patient (recommandé,
#             évite de trouver du « rehaussement » sur une coupe saine).
# "coupe"   : une classification indépendante pour chaque coupe.
echelle = patient
# Garde-fou contre les « faux rehaussements » : le FCM coupe TOUJOURS les pixels en c classes,
# même chez un patient sans aucun LGE. Si la classe la plus brillante n'est pas au moins
# à ce nombre d'écarts-types au-dessus du myocarde sain de référence, le LGE FCM est mis à 0.
# 0 = désactivé (FCM « pur », tel que publié). Valeur raisonnable si activé : 3.
garde_fou_sd = 0

[n_sd]
# Seuils testés (nombre d'écarts-types au-dessus du myocarde sain), séparés par des virgules.
n = 2, 3, 5
# "contour" : utilise le myocarde sain de référence que vous avez tracé
#             (si absent sur une coupe : celui des autres coupes, sinon automatique).
# "auto"    : prend toujours le secteur de 60° le plus sombre de chaque coupe.
remote = contour

[fwhm]
# Seuil = fraction du signal maximal (0.5 = 50 %, la définition classique).
fraction = 0.5
# "patient" : maximum pris sur tout le myocarde du patient ; "coupe" : maximum de chaque coupe.
echelle = patient
# Percentile utilisé comme « maximum » (100 = vrai maximum ; 99 rend le calcul moins sensible au bruit).
percentile_maximum = 100

[masse]
# Densité du myocarde en g/mL.
densite = 1.05
# Épaisseur de chaque tranche pour le calcul du volume :
# "auto" = distance entre deux coupes successives (épaisseur + espace inter-coupes),
# "coupe" = épaisseur de coupe DICOM seule, "intervalle" = distance entre coupes.
epaisseur = auto

[aha]
# Calcul par segment AHA (nécessite le point d'insertion antérieur du VD).
actif = oui
# Mettre "oui" si les numéros de segments apparaissent en miroir sur les images de contrôle.
sens_inverse = non
# Un segment est compté « atteint » si son % de rehaussement dépasse ce seuil.
seuil_segment_pct = 0
# Méthode affichée sur l'œil de bœuf.
methode_oeil_de_boeuf = FCM_pondere

[dicom]
# Si un dossier patient contient plusieurs séries, choisir celle-ci
# (numéro de série, ou mot contenu dans sa description, par exemple PSIR ou LGE).
# Laisser vide pour prendre la série la plus longue.
numero_serie =
description_serie =

[sortie]
images_controle = oui
